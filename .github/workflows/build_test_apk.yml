name: build_test_apk

# Manual only. Builds an installable Android APK of the branch you pick and
# publishes it as a pre-release you can download from the Releases page on a
# phone. Signed with the debug key unless release secrets exist, so it is for
# testing only. Uses AdMob test ads.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Build
        working-directory: app
        run: |
          set -e
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          flutter build apk --release

      - name: Keep the APK on this run page
        uses: actions/upload-artifact@v4
        with:
          name: gevurah-test-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT=$(git rev-parse --short HEAD)
          TAG="test-apk-${{ github.run_number }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "gevurah-test-${SHORT}.apk"
          gh release create "$TAG" "gevurah-test-${SHORT}.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Test APK ${{ github.run_number }} (${{ github.ref_name }} ${SHORT})" \
            --notes "Test build for phone testing. Debug-signed, test ads only. Branch ${{ github.ref_name }}, commit ${SHORT}."
          {
            echo "### Test APK published"
            echo ""
            echo "Download: https://github.com/${{ github.repository }}/releases/download/${TAG}/gevurah-test-${SHORT}.apk"
            echo ""
            echo "Or open Artifacts at the top of this run page (a zip containing the APK)."
          } >> "$GITHUB_STEP_SUMMARY"
