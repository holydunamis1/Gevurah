name: lock_pubspec

# Manual only. Runs `flutter pub get` with the pinned Flutter and commits the
# resulting app/pubspec.lock to the branch it is run on, so every later run
# resolves the same transitive versions (decision 020). It never touches main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Resolve
        working-directory: app
        run: flutter pub get

      - name: Commit the lock file
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock already up to date"
          else
            git commit -q -m "Lock resolved dependency versions"
            git push
          fi
